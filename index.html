<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman 3D Calculator</title>
    <link rel="manifest" href="manifest.json">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

    <style>
        :root {
            --bg: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #3182ce;
            --text: #4a5568;
            /* Naya modern accent hover/active sathi */
            --accent-glow: rgba(49, 130, 206, 0.4); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Mobile var click outline kadhnya sathi */
        }

        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calc-3d {
            background: var(--bg);
            padding: 30px;
            border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark), 
                        -20px -20px 60px var(--shadow-light);
            width: 350px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
            color: var(--text);
            font-weight: 800;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px var(--shadow-dark);
        }

        .brand span { color: var(--accent); }

        #display {
            width: 100%;
            height: 70px;
            background: var(--bg);
            border: none;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                        inset -6px -6px 12px var(--shadow-light);
            padding: 20px;
            font-size: 2rem;
            color: var(--text);
            text-align: right;
            outline: none;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), 
                        -6px -6px 12px var(--shadow-light);
            /* Smooth transitions sathi change */
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* --- MODERN "TUCH" (CLICK) EFFECT --- */
        
        /* 1. Scale/Haptic effect: Button thoda lahan hoto dabalyavar */
        button:active {
            transform: scale(0.92); /* 3D press feel */
            box-shadow: 2px 2px 5px var(--shadow-dark), 
                        -2px -2px 5px var(--shadow-light); /* Shadows kamit hoto */
        }

        /* 2. Modern Glow Pulse effect: Button chya mage ek light petate */
        button::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--accent-glow);
            border-radius: 50%;
            opacity: 0;
            transform: scale(1);
            transition: opacity 0.3s, transform 0.3s;
        }

        button:active::after {
            opacity: 1;
            transform: scale(1.5); /* Light baher pasarat jaate */
            transition: 0s; /* Instant reaction sathi */
        }

        /* Special buttons chya glow cha color change */
        .ac:active::after { background: rgba(229, 62, 62, 0.3); }

        .op { color: var(--accent); font-size: 1.5rem; }
        .ac { color: #e53e3e; }

        .equal {
            grid-column: span 2;
            width: 100%;
            border-radius: 30px;
            background: var(--accent);
            color: white;
            box-shadow: 6px 6px 12px rgba(49, 130, 206, 0.4), 
                        -6px -6px 12px var(--shadow-light);
        }

        /* Equal button sathi naya modern effect */
        .equal:active {
            background: #2b6cb0;
            transform: scale(0.96); /* Motha button aahe mhnun kami scale */
            box-shadow: 2px 2px 6px rgba(49, 130, 206, 0.6), 
                        -2px -2px 6px var(--shadow-light);
        }
        /* Equal chya glow la band karne (background change hotoy mhnun garaj nahi) */
        .equal:active::after { display: none; }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--shadow-dark);
        }
    </style>
</head>
<body>

<div class="calc-3d">
    <div class="brand">AMAN <span>CALCULATOR</span></div>
    <input type="text" id="display" readonly placeholder="0">
    
    <div class="btn-grid">
        <button class="ac" onclick="clearD()">AC</button>
        <button class="op" onclick="del()">C</button>
        <button class="op" onclick="ins('%')">%</button>
        <button class="op" onclick="ins('/')">÷</button>

        <button onclick="ins('7')">7</button>
        <button onclick="ins('8')">8</button>
        <button onclick="ins('9')">9</button>
        <button class="op" onclick="ins('*')">×</button>

        <button onclick="ins('4')">4</button>
        <button onclick="ins('5')">5</button>
        <button onclick="ins('6')">6</button>
        <button class="op" onclick="ins('-')">-</button>

        <button onclick="ins('1')">1</button>
        <button onclick="ins('2')">2</button>
        <button onclick="ins('3')">3</button>
        <button class="op" onclick="ins('+')">+</button>

        <button onclick="ins('0')">0</button>
        <button onclick="ins('.')">.</button>
        <button class="equal" onclick="calc()">=</button>
    </div>
    <div class="footer">Premium 3D Interface by Saiyadbazar</div>
</div>

<script>
    const d = document.getElementById('display');
    const ins = (v) => { if(d.value.length < 10) d.value += v; }
    const clearD = () => d.value = "";
    const del = () => d.value = d.value.slice(0, -1);
    const calc = () => {
        try { d.value = eval(d.value.replace('×','*').replace('÷','/')); }
        catch { d.value = "SORRY BROTHER"; setTimeout(clearD, 1000); }
    }
</script>

</body>
</html>
